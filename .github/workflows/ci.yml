name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run --all-groups --frozen pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public values (safe in the browser). Set as repository secrets to enable e2e tests.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Playwright (needs Supabase secrets)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: npx playwright install --with-deps chromium && npm run test:e2e
