[project]
name = "companion-ai"
version = "0.1.0"
description = "LLM-powered wellness companion with cited sources and strict non-medical guardrails."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "mcp>=2.3",
    "httpx>=0.27",
    "langsmith>=0.1",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["streamlit>=1.37"]
evals = ["ragas>=0.4", "deepeval>=3.5", "datasets>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/companion", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
